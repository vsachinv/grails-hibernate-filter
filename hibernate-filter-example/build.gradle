buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins"
        classpath "cloud.wondrify:asset-pipeline-gradle"
    }
}

apply plugin: "groovy"
apply plugin: "idea"
apply plugin: "eclipse"
apply plugin: "war"
apply plugin: "application"
apply plugin: "org.apache.grails.gradle.grails-web"
apply plugin: "org.apache.grails.gradle.grails-gsp"
apply plugin: "cloud.wondrify.asset-pipeline"

group = "hibernate.filter.example"

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://repo.grails.org/grails/restricted' }
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")

    implementation project(':hibernate-filter-plugin')

    // Canonical Grails 7 web application module set (controllers, gsp, layout, interceptors,
    // converters, url-mappings, spring-boot starters, ...). Do not hand-list these: a missing
    // module compiles fine and only fails at runtime (grails-layout was missing once).
    implementation "org.apache.grails:grails-dependencies-starter-web"
    implementation "org.apache.grails.i18n:grails-i18n"          // not in the starter; g:message + LocaleResolver
    implementation "org.apache.grails:grails-data-hibernate5"
    implementation "org.apache.grails:grails-scaffolding"
    implementation "org.hibernate:hibernate-core-jakarta"

    assets  "org.apache.grails:grails-dependencies-assets"

    runtimeOnly "cloud.wondrify:asset-pipeline-grails"   // <asset:*> taglib at runtime; the Gradle plugin alone only builds assets
    runtimeOnly "com.h2database:h2"
    runtimeOnly "org.apache.tomcat:tomcat-jdbc"
    runtimeOnly "org.fusesource.jansi:jansi"

    testImplementation "org.apache.grails:grails-dependencies-test"
    testImplementation "org.apache.grails.testing:grails-testing-support-core"
    testImplementation "net.bytebuddy:byte-buddy"
    testRuntimeOnly    "net.bytebuddy:byte-buddy-agent"
}

application {
    mainClass.set("hibernate.filter.example.Application")
}

compileJava.options.release = 17

// https://github.com/apache/grails-core/issues/15321
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.optimizationOptions.indy = false
    groovyOptions.forkOptions.jvmArgs = ['-Xmx1024m']
}

bootRun {
    ignoreExitValue true
    jvmArgs('-Dspring.output.ansi.enabled=always', '-XX:TieredStopAtLevel=1', '-Xmx1024m')
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

assets {
    minifyJs = true
    minifyCss = true
}
